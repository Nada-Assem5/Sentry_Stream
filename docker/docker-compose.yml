networks:
  sentrystream-net:
    driver: bridge

volumes:
  namenode-data:
  datanode-data:
  hbase-data:
  es-data:

services:

  # INGESTION — Kafka + Zookeeper (owned by: Ingestion member)

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sentrystream-zookeeper
    profiles: [ "ingestion", "full" ]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - sentrystream-net
    mem_limit: 512m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentrystream-kafka
    profiles: [ "ingestion", "full" ]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - sentrystream-net
    mem_limit: 1g

  producer:
    image: python:3.11-slim
    container_name: sentrystream-producer
    profiles: [ "ingestion", "full" ]
    depends_on:
      - kafka
    working_dir: /app
    volumes:
      - ../ingestion:/app
      - ../data:/data
    command: [ "bash", "-c", "pip install kafka-python && python -u producer_realtime.py" ]
    networks:
      - sentrystream-net

  # PROCESSING — Spark standalone (owned by: Processing/ML member)

  spark-master:
    image: apache/spark:3.5.1
    container_name: sentrystream-spark-master
    profiles: [ "processing", "full" ]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077" # Spark master RPC (spark-submit connects here)
      - "8081:8080" # Spark master web UI -> http://localhost:8081
    networks:
      - sentrystream-net
    mem_limit: 1g

  spark-worker:
    image: apache/spark:3.5.1
    container_name: sentrystream-spark-worker
    profiles: [ "processing", "full" ]
    # Executors write the Parquet output; the driver (spark-preprocessing) runs
    # as root, so match it here or the two disagree over /output's ownership.
    user: root
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 1g
    ports:
      - "8082:8081"
    volumes:
      - ../data:/data
      - ../processing/output:/output
    networks:
      - sentrystream-net
    mem_limit: 1g

  spark-preprocessing:
    build:
      context: ../processing
    container_name: sentrystream-preprocessing
    profiles: [ "processing", "full" ]
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ../data:/data
      - ../processing/output:/output
    networks:
      - sentrystream-net
    mem_limit: 1g

  spark-classification:
    build:
      context: ../processing
    container_name: sentrystream-classification
    profiles: [ "processing", "full" ]
    command: [ "python", "-u", "streaming_classification.py" ]
    depends_on:
      - spark-master
      - spark-worker
      - hbase
      - elasticsearch
      - namenode
    volumes:
      - ../data:/data
      - ../processing/output:/output
    networks:
      - sentrystream-net
    mem_limit: 1g

  # STORAGE — HDFS + Hive + HBase (owned by: Storage member)

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: sentrystream-namenode
    profiles: [ "storage", "full" ]
    environment:
      CLUSTER_NAME: sentrystream
    ports:
      - "9870:9870" # HDFS web UI -> http://localhost:9870
      - "9000:9000"
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - sentrystream-net
    mem_limit: 1g

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sentrystream-datanode
    profiles: [ "storage", "full" ]
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    ports:
      - "9864:9864"
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - sentrystream-net
    mem_limit: 1g

  hive-server:
    image: bde2020/hive:2.3.2
    container_name: sentrystream-hive
    profiles: [ "storage", "full" ]
    depends_on:
      - namenode
      - datanode
    command: hiveserver2
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: "hdfs://namenode:9000/user/hive/warehouse"
    ports:
      - "10000:10000" # Thrift (JDBC/beeline connects here)
      - "10002:10002" # Hive web UI -> http://localhost:10002
    networks:
      - sentrystream-net
    mem_limit: 1g

  hbase:
    image: bde2020/hbase-standalone:1.0.0-hbase1.2.6
    container_name: sentrystream-hbase
    profiles: [ "storage", "full" ]
    environment:
      HBASE_CONF_hbase_rootdir: "hdfs://namenode:9000/hbase"
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"
    ports:
      - "16010:16010" # HBase master web UI -> http://localhost:16010
      - "9090:9090" # HBase Thrift (used by the API layer, e.g. happybase)
    networks:
      - sentrystream-net
    mem_limit: 1g

  # SEARCH — Elasticsearch (owned by: Visualization/Integration member)

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: sentrystream-elasticsearch
    profiles: [ "search", "full" ]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200" # -> http://localhost:9200
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - sentrystream-net
    mem_limit: 1g

  # VISUALIZATION — API + Dashboard (owned by: Visualization/Integration member)

  api:
    build:
      context: ../visualization/api
    container_name: sentrystream-api
    profiles: [ "search", "full" ]
    depends_on:
      - hbase
      - elasticsearch
    ports:
      - "8000:8000" # -> http://localhost:8000
    networks:
      - sentrystream-net
    mem_limit: 512m
